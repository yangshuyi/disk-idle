# disk-idle 配置（修改后 sudo systemctl restart disk-idle 生效）

# 检测/保活周期（秒）。使用期内每个周期直读整盘第 0 扇区一次（只读、不计入真实读写），
# 阻止硬盘盒固件提前休眠，所以必须小于固件的休眠时间（Orico 约 30 秒）
CHECK_INTERVAL=20

# 闲置多久后停止保活（秒），之后由硬盘盒固件自动休眠
IDLE_TIMEOUT=3600

# 一个周期内真实读写量低于这个值（KB）视为闲置，0 = 任何读写都算访问
# （统计的是分区读写，保活读取不计入）
MIN_ACTIVITY_KB=1024

# 监控哪些盘：
#   auto  = 自动监控所有 USB 连接的机械盘（rotational=1）
#   或者写 /dev/disk/by-id 下的名字（空格分隔，支持通配符），只监控这些
DISKS="auto"

# 排除的盘（by-id 名字，支持通配符），auto 模式下也生效
EXCLUDE=""

# 调试：1 = 不做保活读取，只打印每周期读写量
DRY_RUN=0
